<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pengumpulan Tugas Essay</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Font Inter dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style untuk loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 24px;
            height: 24px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-lg shadow-xl p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Formulir Pengumpulan Tugas</h1>
            <p class="text-gray-500 mt-2">Silakan isi data diri dan unggah laporan essay Anda.</p>
        </div>

        <!-- Formulir Pengumpulan -->
        <form name="submit-to-google-sheet" id="task-form" class="space-y-6">
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="Contoh: Budi Sanjaya">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="kelas" class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                    <select id="kelas" name="kelas" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                        <option value="" disabled selected>Pilih Kelas</option>
                        <option value="X IPA 1">XII-7</option>
                        <option value="X IPA 2">XII-8</option>
                        </select>
                </div>
                <div>
                    <label for="absen" class="block text-sm font-medium text-gray-700 mb-1">Nomor Absen</label>
                    <input type="number" id="absen" name="absen" required min="1" max="50" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="Contoh: 12">
                </div>
            </div>

            <div>
                <label for="essay" class="block text-sm font-medium text-gray-700 mb-1">Tugas / Laporan Essay</label>
                <textarea id="essay" name="essay" rows="8" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="Salin dan tempel (copy-paste) seluruh isi laporan essay Anda di sini..."></textarea>
            </div>

            <!-- Tombol Kirim -->
            <div class="text-right">
                <button type="submit" id="submit-button" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    <span id="button-text">Kirim Tugas</span>
                    <div id="loading-spinner" class="loader hidden ml-3"></div>
                </button>
            </div>
        </form>

        <!-- Pesan Status Pengiriman -->
        <div id="status-message" class="mt-6 text-center p-4 rounded-md hidden"></div>
    </div>

    <script>
        // --- SANGAT PENTING: Ganti URL di bawah ini dengan URL Web App Anda ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzCjlj-m6a9nDli77vQF0MMLZH2VXLwwRdLOHhEAwkusI8_lK6ZRHrNsPxmOFsBjrA-/exec';
        // -----------------------------------------------------------------

        const form = document.forms['submit-to-google-sheet'];
        const submitButton = document.getElementById('submit-button');
        const buttonText = document.getElementById('button-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', e => {
            e.preventDefault();

            // Tampilkan loading dan nonaktifkan tombol
            buttonText.textContent = 'Mengirim...';
            loadingSpinner.classList.remove('hidden');
            submitButton.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    console.log('Success!', response);
                    displayStatus('Tugas Anda berhasil terkirim! Terima kasih.', true);
                    form.reset();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    displayStatus('Maaf, terjadi kesalahan. Silakan coba lagi.', false);
                })
                .finally(() => {
                    // Kembalikan tombol ke keadaan semula
                    buttonText.textContent = 'Kirim Tugas';
                    loadingSpinner.classList.add('hidden');
                    submitButton.disabled = false;
                });
        });

        function displayStatus(message, isSuccess) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden');
            if (isSuccess) {
                statusMessage.classList.remove('bg-red-100', 'text-red-700');
                statusMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                statusMessage.classList.remove('bg-green-100', 'text-green-700');
                statusMessage.classList.add('bg-red-100', 'text-red-700');
            }
        }
    </script>
</body>
</html>
